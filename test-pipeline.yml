# Pipeline Test Configuration
# Bu dosya Jenkins pipeline'ın otomatik tetiklenmesini test etmek için kullanılır
# Her git push yaptığınızda Jenkins bu değişikliği algılayıp pipeline'ı başlatır

version: '1.0'
test_date: "2024-01-01"
pipeline_trigger: "git-push"
description: "Jenkins pipeline otomatik tetikleme test dosyası"

# Test bilgileri
test:
  name: "Pipeline Auto-Trigger Test"
  purpose: "Git push ile Jenkins pipeline'ın otomatik çalışmasını test etmek"
  expected_behavior: "Push yaptıktan sonra Jenkins pipeline otomatik başlamalı"
  
# Pipeline kontrol noktaları
pipeline_stages:
  - checkout
  - build
  - test
  - deploy
  
# Notlar
notes: |
  Bu dosyayı her değiştirdiğinizde ve push yaptığınızda:
  1. Jenkins polling (her 1 dakikada) veya webhook tarafından algılanır
  2. Pipeline otomatik başlar
  3. Build başarılı/başarısız email alırsınız

# Son güncelleme
last_updated: "2024-01-01T00:00:00Z"

