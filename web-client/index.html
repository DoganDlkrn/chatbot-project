<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - Akıllı Asistan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: #f5f5f5;
            border: none;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab.active {
            background: white;
            border-bottom: 3px solid #667eea;
            font-weight: bold;
            color: #667eea;
        }

        .tab:hover {
            background: #e9e9e9;
        }

        .content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        /* Chat Tab */
        .messages {
            flex: 1;
            overflow-y: scroll;
            overflow-x: hidden;
            padding: 20px;
            background: #f9f9f9;
            max-height: calc(100vh - 300px);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message > div { max-width: 72%; }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.45;
            white-space: normal;
            overflow-wrap: break-word;
            word-break: keep-all;         /* never break within words like 'yani' */
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.bot .message-bubble {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-bottom-left-radius: 6px;
        }

        .message-info {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.7;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .input-area button:hover {
            transform: scale(1.05);
        }

        .input-area button:active {
            transform: scale(0.95);
        }

        /* Upload Tab */
        .upload-area {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
        }

        .drop-zone {
            width: 100%;
            max-width: 500px;
            padding: 60px;
            border: 3px dashed #667eea;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f9f9f9;
        }

        .drop-zone:hover {
            border-color: #764ba2;
            background: #f0f0f0;
        }

        .drop-zone.dragover {
            background: #e9ecef;
            border-color: #764ba2;
        }

        .drop-zone i {
            font-size: 64px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .document-list {
            width: 100%;
            max-width: 500px;
            margin-top: 30px;
        }

        .document-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .document-info {
            flex: 1;
        }

        .document-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .document-meta {
            font-size: 12px;
            color: #666;
        }

        .delete-btn {
            padding: 8px 15px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #ff3838;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }

        .status-badge.success {
            background: #2ecc71;
            color: white;
        }

        .status-badge.pending {
            background: #f39c12;
            color: white;
        }

        .status-badge.error {
            background: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Akıllı Chatbot Asistanı</h1>
            <p>Sorularınızı sorun veya doküman yükleyin</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('chat')">💬 Sohbet</button>
            <button class="tab" onclick="switchTab('upload')">📄 Doküman Yükle</button>
        </div>

        <div class="content">
            <!-- Chat Tab -->
            <div id="chat-tab" class="tab-content active">
                <div class="messages" id="messages">
                    <div class="message bot">
                        <div>
                            <div class="message-bubble">
                                Merhaba! Ben akıllı chatbot asistanınızım. Size nasıl yardımcı olabilirim?
                            </div>
                        </div>
                    </div>
                </div>
                <div class="input-area">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Mesajınızı yazın..." 
                        onkeypress="handleKeyPress(event)"
                    >
                    <button onclick="sendMessage()">Gönder</button>
                </div>
            </div>

            <!-- Upload Tab -->
            <div id="upload-tab" class="tab-content">
                <div class="upload-area">
                    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                        <div style="font-size: 64px; margin-bottom: 20px;">📎</div>
                        <h3>Dosya yüklemek için tıklayın veya sürükleyin</h3>
                        <p style="margin-top: 10px; color: #666;">PDF, TXT, DOC, DOCX desteklenir (Max 10MB)</p>
                        <input type="file" id="fileInput" style="display: none;" onchange="uploadFile()" accept=".pdf,.txt,.doc,.docx">
                    </div>

                    <div class="loading" id="uploadLoading">
                        <div class="spinner"></div>
                        <p style="margin-top: 15px;">Dosya yükleniyor...</p>
                    </div>

                    <div class="document-list" id="documentList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';
        let sessionId = null;

        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');

            if (tabName === 'upload') {
                loadDocuments();
            }
        }

        // Chat functionality
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        }

        let sending = false;

        async function sendMessage() {
            if (sending) return; // prevent double-sends
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;

            addMessage('user', message);
            input.value = '';
            sending = true;

            try {
                const response = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        sessionId: sessionId 
                    })
                });

                const data = await response.json();
                
                if (!sessionId) {
                    sessionId = data.sessionId;
                }

                addMessage('bot', data && data.message ? data.message : '', data && data.source, data && data.confidence);
            } catch (error) {
                addMessage('bot', 'Üzgünüm, bir hata oluştu. Lütfen tekrar deneyin.', 'error');
            } finally { sending = false; }
        }

        function addMessage(type, text, source = null, confidence = null) {
            if (text === undefined || text === null) return; // avoid 'undefined' bubbles
            const safeText = String(text).trim();
            if (!safeText) return;

            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const wrapper = document.createElement('div');
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = safeText; // prevent HTML injection and preserve text
            wrapper.appendChild(bubble);

            if (source && type === 'bot') {
                const sourceText = source === 'database' ? 'Bilgi Bankası' : 
                                   source === 'document' ? 'Doküman' : 'Genel';
                const badge = source === 'database' ? 'success' : 
                              source === 'document' ? 'pending' : 'error';
                const info = document.createElement('div');
                info.className = 'message-info';
                const span = document.createElement('span');
                span.className = `status-badge ${badge}`;
                span.textContent = sourceText;
                info.append('Kaynak: ', span);
                wrapper.appendChild(info);
            }

            messageDiv.appendChild(wrapper);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // File upload functionality
        const dropZone = document.getElementById('dropZone');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileUpload(files[0]);
            }
        });

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (file) {
                await handleFileUpload(file);
                fileInput.value = '';
            }
        }

        async function handleFileUpload(file) {
            const loading = document.getElementById('uploadLoading');
            loading.classList.add('active');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_URL}/api/documents/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('Dosya başarıyla yüklendi!');
                    loadDocuments();
                } else {
                    const error = await response.json();
                    alert('Hata: ' + (error.error || 'Dosya yüklenemedi'));
                }
            } catch (error) {
                alert('Bağlantı hatası: ' + error.message);
            } finally {
                loading.classList.remove('active');
            }
        }

        async function loadDocuments() {
            try {
                const response = await fetch(`${API_URL}/api/documents`);
                const documents = await response.json();

                const listDiv = document.getElementById('documentList');
                
                if (documents.length === 0) {
                    listDiv.innerHTML = '<p style="text-align: center; color: #666;">Henüz doküman yüklenmemiş.</p>';
                    return;
                }

                listDiv.innerHTML = documents.map(doc => `
                    <div class="document-item">
                        <div class="document-info">
                            <div class="document-name">📄 ${doc.filename}</div>
                            <div class="document-meta">
                                ${formatFileSize(doc.size)} • ${formatDate(doc.uploaded_at)}
                                ${doc.indexed ? '<span class="status-badge success">İndeksli</span>' : '<span class="status-badge pending">İndeksleniyor</span>'}
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteDocument(${doc.id})">Sil</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Dokümanlar yüklenemedi:', error);
            }
        }

        async function deleteDocument(id) {
            if (!confirm('Bu dokümanı silmek istediğinizden emin misiniz?')) return;

            try {
                await fetch(`${API_URL}/api/documents/${id}`, { method: 'DELETE' });
                loadDocuments();
            } catch (error) {
                alert('Silme hatası: ' + error.message);
            }
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('tr-TR') + ' ' + date.toLocaleTimeString('tr-TR');
        }

        // Load documents on page load
        window.addEventListener('load', () => {
            // Optional: Check API health
            fetch(`${API_URL}/api/chat/health`)
                .then(res => res.json())
                .then(data => console.log('API Status:', data))
                .catch(err => console.error('API not available:', err));
        });
    </script>
</body>
</html>
