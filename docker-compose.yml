version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - chatbot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for Haystack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - chatbot_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Haystack Python Service
  haystack-service:
    build:
      context: ./HaystackService
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chatbot_db
      # Chat Generation (Local Ollama)
      - LLM_API_KEY=ollama
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=gemma3:1b
      # Embeddings via Ollama (nomic-embed-text)
      - EMBED_API_KEY=ollama
      - EMBED_BASE_URL=http://ollama:11434/v1
      - LLM_EMBEDDINGS_MODEL=nomic-embed-text
      # FAISS Persistence
      - USE_FAISS=true
      - FAISS_INDEX_PATH=/data/vector/faiss.index
      - FAISS_CONFIG_PATH=/data/vector/faiss_config.json
      - FAISS_DOC_PATH=/data/vector/faiss_store.db
    volumes:
      - ./uploads:/app/uploads
      - ./vector_store:/data/vector
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - chatbot_network
    restart: unless-stopped

  # Local LLM Service (Ollama)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - chatbot_network
    restart: always

  # Init container to pull the model automatically
  ollama-init:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=ollama:11434
    networks:
      - chatbot_network
    entrypoint: /bin/sh
    command: -c "echo 'Waiting for Ollama...'; sleep 5; echo 'Pulling gemma3:1b...'; ollama pull gemma3:1b; echo 'Model pulled!'"
    depends_on:
      - ollama


  # C# Chatbot API
  chatbot-api:
    build:
      context: ./ChatbotAPI
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=chatbot_db;Username=postgres;Password=postgres
      - HaystackService__BaseUrl=http://haystack-service:8001
      - SMTP__Host=${SMTP_HOST}
      - SMTP__Port=${SMTP_PORT}
      - SMTP__Username=${SMTP_USER}
      - SMTP__Password=${SMTP_PASSWORD}
      - SMTP__NotificationEmail=${NOTIFICATION_EMAIL}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      haystack-service:
        condition: service_started
    networks:
      - chatbot_network
    restart: unless-stopped

  # Jenkins CI/CD Server
  jenkins:
    build:
      context: ./jenkins-docker
      dockerfile: Dockerfile
    privileged: true
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    networks:
      - chatbot_network
    restart: unless-stopped

networks:
  chatbot_network:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
  jenkins_data:
  ollama_data:

